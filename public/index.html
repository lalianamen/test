<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoLux — Get Approved</title>
  <meta name="description" content="Apply for auto financing with AutoLux. Secure online application — checking your rate won't affect your credit score.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(900px 500px at 80% -10%, rgba(212, 165, 72, 0.18), transparent 60%),
        linear-gradient(160deg, #0b1220 0%, #101a2e 55%, #16233d 100%);
      color: #c3ccdf;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 560px; }
    .logo {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2.6rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 10px;
    }
    .logo span { color: #d4a548; }
    p { margin: 0 0 32px; font-size: 1.08rem; line-height: 1.6; }
    .btn {
      display: inline-block;
      padding: 18px 44px;
      border-radius: 999px;
      background: linear-gradient(135deg, #d4a548, #c08f2f);
      color: #0b1220;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 26px rgba(212, 165, 72, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(212, 165, 72, 0.5); }
    .note { margin-top: 18px; font-size: 0.85rem; color: #8f9ab4; }
  </style>
</head>
<body>
  <div class="box">
    <h1 class="logo">Auto<span>Lux</span></h1>
    <p>Get approved for your next car in minutes.</p>
    <a class="btn"
       href="https://apply.autopay.com/unified?partnerUniqueId=&amp;ap%5Ba%5D%5BpartnerRecordUniqueIdentifier%5D=&amp;leadChannel=AUTOPAY_AUTO_LUX_FAST_TRACK_API"
       target="_blank" rel="noopener">
      Get Approved
    </a>
    <p class="note">Secure application &middot; Soft credit pull — checking your rate won't affect your credit score</p>
  </div>
</body>
</html>
